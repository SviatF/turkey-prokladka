<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">90+ Türkiye</title>
  <desc id="desc">90+ Türkiye football channel logo</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="70%">
      <stop offset="0" stop-color="#202023"/>
      <stop offset="0.68" stop-color="#080809"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5263"/>
      <stop offset="0.5" stop-color="#ff1c2f"/>
      <stop offset="1" stop-color="#8c0715"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="238" fill="#080808" stroke="#ffffff" stroke-width="8"/>
  <circle cx="256" cy="256" r="221" fill="url(#bg)" stroke="url(#ring)" stroke-width="16" filter="url(#glow)"/>
  <path d="M151 348 C196 374 316 379 363 344" fill="none" stroke="#ff1c2f" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  <text x="246" y="278" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="176" font-weight="900" letter-spacing="-16" fill="#ffffff">90</text>
  <text x="383" y="186" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="92" font-weight="900" fill="#ff1c2f">+</text>
  <text x="256" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="5" fill="#ffffff">TÜRKİYE</text>
</svg>
